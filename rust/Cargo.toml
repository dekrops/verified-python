# SPDX-License-Identifier: Apache-2.0

[package]
name = "verified-python-native"
description = "Python bindings to the public Work Verification Protocol crates of dekrops/verified-cli."
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/dekrops/verified-python"
license = "Apache-2.0"
# Distributed only inside the verified-python wheel.
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

# The verification crates are pinned to the commit of a tag of
# dekrops/verified-cli (v0.1.4). They are not on
# crates.io. Change all six together, with the result tables in
# docs/protocol-compatibility.md, in one pull request.
[dependencies]
verified-canonical = { git = "https://github.com/dekrops/verified-cli", rev = "4d41004eed165a2df65523f0d9753cbf050f306e", version = "0.1.4" }
verified-contract = { git = "https://github.com/dekrops/verified-cli", rev = "4d41004eed165a2df65523f0d9753cbf050f306e", version = "0.1.4" }
verified-history = { git = "https://github.com/dekrops/verified-cli", rev = "4d41004eed165a2df65523f0d9753cbf050f306e", version = "0.1.4" }
verified-protocol = { git = "https://github.com/dekrops/verified-cli", rev = "4d41004eed165a2df65523f0d9753cbf050f306e", version = "0.1.4" }
verified-verifier = { git = "https://github.com/dekrops/verified-cli", rev = "4d41004eed165a2df65523f0d9753cbf050f306e", version = "0.1.4" }
verified-work-unit = { git = "https://github.com/dekrops/verified-cli", rev = "4d41004eed165a2df65523f0d9753cbf050f306e", version = "0.1.4" }

base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", default-features = false }
pyo3 = { version = "0.29.3", features = ["abi3-py311"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
