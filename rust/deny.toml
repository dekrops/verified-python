# SPDX-License-Identifier: Apache-2.0
# Dependency policy for the native extension: `cargo deny check` in rust/.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Zlib: foldhash, in the Cedar policy engine's graph (verified-derivation).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The verification crates are unpublished; they come from one reviewed commit.
allow-git = ["https://github.com/dekrops/verified-cli"]
