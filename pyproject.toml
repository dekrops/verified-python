[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "verified-python"
version = "0.1.0"
description = "Python SDK for the Work Verification Protocol: verifiable agent work, checked offline."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-LICENSES.md"]
authors = [{ name = "Krops GmbH" }]
keywords = ["verification", "agents", "evidence", "wvp", "attestation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Security",
  "Typing :: Typed",
]
# The core SDK has no runtime dependency.
dependencies = []

[project.optional-dependencies]
# Only extras that are implemented and tested are listed.
openai-agents = ["openai-agents>=0.23,<1"]
langgraph = ["langgraph>=1.2,<2"]

[project.urls]
Repository = "https://github.com/dekrops/verified-python"
Protocol = "https://github.com/dekrops/wvp"
Issues = "https://github.com/dekrops/verified-python/issues"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "maturin>=1.9,<2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

# Optional frameworks, for the adapter tests only.
adapters = ["openai-agents>=0.23,<1", "langgraph>=1.2,<2"]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "verified._native"
python-source = "src"
features = ["pyo3/extension-module"]
locked = true
include = [{ path = "LICENSE", format = "sdist" }, { path = "NOTICE", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
asyncio_mode = "auto"
markers = [
  "conformance: runs the published WVP conformance corpus",
  "openai_agents: needs the optional openai-agents extra",
  "langgraph: needs the optional langgraph extra",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "ASYNC", "TID", "PL"]
ignore = [
  "PLR0913", # explicit keyword arguments beat option bags in a public API
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915", "S105", "S106", "TID252", "SLF001", "S603"]
"examples/**" = ["S101", "T201", "S105", "S106", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "examples"]
warn_unreachable = true
